    <title>VEXA — Own Your Time</title>
    <script>
      // Apply the saved theme before the app loads to avoid a light/dark flash.
      (function () {
        var theme = 'system';
        try {
          var saved = JSON.parse(localStorage.getItem('vexa-data') || 'null');
          if (saved && saved.settings && saved.settings.theme) theme = saved.settings.theme;
        } catch (e) {
          /* unreadable data is handled by the app on startup */
        }
        if (theme === 'system') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
